<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flappy! - Evolve</title>
    <link href="manifest.webmanifest" rel="manifest">
    <link href="favicon.ico" rel="shortcut icon" type="image/x-icon">
    <link href="styles.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div id="evolve-screen" class="screen">
        <div class="canvas-wrapper">
            <canvas id="canvas">Hi Netscape User ;)</canvas>
            <dl class="stat-list">
                <div class="stat">
                    <dt class="stat-label">Generation</dt>
                    <dd id="generation" class="stat-value">0</dd>
                </div>
                <div class="stat">
                    <dt class="stat-label">Score</dt>
                    <dd id="score" class="stat-value">0</dd>
                </div>
            </dl>
            <ul class="button-list">
                <li><button id="end-button" class="button">End</button></li>
            </ul>
        </div>
    </div>
    <script src="src/evolve-screen.js" type="module"></script>
</body>

</html>
